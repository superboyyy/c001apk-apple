name: c001apk
options:
  bundleIdPrefix: com.superboyyy.c001apk
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
packages:
  CoolapkKit:
    path: Packages/CoolapkKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "100"
    SWIFT_STRICT_CONCURRENCY: minimal
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: true
targets:
  c001apk-macOS:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
      - path: App/macOS
      - path: App/Resources
        excludes: ["emojis"]
      - path: App/Resources/emojis
        type: folder
        buildPhase: resources
    dependencies:
      - package: CoolapkKit
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: 酷果
        CFBundleName: 酷果
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.social-networking
        NSHumanReadableCopyright: "非官方酷安客户端 · GNU AGPL v3"
        CFBundleURLTypes:
          - CFBundleURLName: com.superboyyy.c001apk.link
            CFBundleURLSchemes: [coolmarket, c001apk]
    entitlements:
      path: App/macOS/c001apk.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superboyyy.c001apk.macos
        PRODUCT_NAME: 酷果
        PRODUCT_MODULE_NAME: c001apk
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_USER_SCRIPT_SANDBOXING: true
  c001apk-iPadOS:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
      - path: App/iPadOS
      - path: App/Resources
        excludes: ["emojis"]
      - path: App/Resources/emojis
        type: folder
        buildPhase: resources
    dependencies:
      - package: CoolapkKit
    info:
      path: App/iPadOS/Info.plist
      properties:
        CFBundleDisplayName: 酷果
        CFBundleName: 酷果
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.social-networking
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.superboyyy.c001apk.link
            CFBundleURLSchemes: [coolmarket, c001apk]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superboyyy.c001apk.ipados
        PRODUCT_NAME: 酷果
        PRODUCT_MODULE_NAME: c001apk
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
schemes:
  c001apk-iPadOS:
    build:
      targets:
        c001apk-iPadOS: all
    run:
      config: Debug
    archive:
      config: Release
  c001apk-macOS:
    build:
      targets:
        c001apk-macOS: all
    run:
      config: Debug
    archive:
      config: Release
